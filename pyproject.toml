[project]
name = "comfyui-marigold-v2"
description = "Marigold V2 in ComfyUI: single-step depth, surface normals, and albedo from one image."
version = "1.0.0"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "diffusers>=0.35.0",
    "peft>=0.14.0",
    "bitsandbytes>=0.45.0",
    "transformers>=4.51.0",
    "accelerate>=1.0.0",
    "safetensors>=0.4.0",
    "huggingface_hub>=0.30.0",
    "matplotlib>=3.5.0",
]

[project.urls]
Repository = "https://github.com/BrunoFargnoli/ComfyUI-Marigold-v2"

[tool.comfy]
# Set PublisherId to your Comfy Registry publisher before running `comfy node publish`.
PublisherId = ""
DisplayName = "ComfyUI-Marigold-v2"
Icon = ""

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
